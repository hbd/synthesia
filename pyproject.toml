[project]
name = "synthesia"
version = "0.1.0"
description = "Real-time audio-to-visual synthesis system with AI generation"
authors = [
    {name = "Synthesia Team"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core dependencies
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pyaudio>=0.2.14",
    "scipy>=1.10.0",
    "pillow>=10.0.0",
    # Machine Learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.25.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "safetensors>=0.3.0",
    # Utilities
    "huggingface-hub>=0.16.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "packaging>=23.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
    "yt-dlp>=2025.5.22",
]

[project.optional-dependencies]
# Performance optimizations for high-end GPUs
gpu-optimized = [
    "xformers>=0.0.20",
    # flash-attn requires special installation, install manually if needed
    # "flash-attn>=2.0.0",  
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
]

# Audio development tools
audio-dev = [
    "librosa>=0.10.0",
    "matplotlib>=3.7.0",
    "soundfile>=0.12.0",
]

[project.scripts]
synthesia = "audio_visual_sd_system:main"
synthesia-basic = "audio_visual_prototype:main"

[project.urls]
Homepage = "https://github.com/your-org/synthesia"
Repository = "https://github.com/your-org/synthesia"
Documentation = "https://github.com/your-org/synthesia/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# PyTorch specific configurations
[tool.torch]
# Optimize for RTX A6000 architecture
cuda_arch_list = "8.6"
